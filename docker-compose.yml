# One command: `docker compose up --build`, then open http://localhost:8000
# First start downloads the models (~2.3 GB) – watch progress with `docker compose logs -f ollama-pull`.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment to use an NVIDIA GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${CHAT_MODEL:-llama3.2} && ollama pull ${EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  app:
    build: .
    depends_on: [ollama]
    ports:
      - "8000:8000"
    environment:
      - PROBELYN_OLLAMA_URL=http://ollama:11434
      - PROBELYN_CHAT_MODEL=${CHAT_MODEL:-llama3.2}
      - PROBELYN_EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
    volumes:
      - appdata:/data

volumes:
  ollama:
  appdata:
